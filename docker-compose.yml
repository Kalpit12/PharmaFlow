services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmora-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pharmora
      POSTGRES_PASSWORD: pharmora
      POSTGRES_DB: pharmora
    volumes:
      - pharmora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmora -d pharmora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pharmora_pg:
